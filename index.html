<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>AESF RADAR</title>

<style>
:root{
  color-scheme:dark;
  --bg:#07111f;
  --card:#0e1b2c;
  --line:#203249;
  --text:#f4f7fb;
  --muted:#93a4b8;
  --blue:#1495ff;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{max-width:800px;margin:auto;padding:20px 14px 80px}
h1{font-size:24px;margin:5px 0 18px}
.logo{color:#55b8ff}
.search{display:flex;gap:8px}
input{
  flex:1;background:#0b1726;border:1px solid #2a3d55;
  border-radius:14px;padding:14px;color:white;font-size:16px;
}
button{
  border:0;border-radius:13px;background:var(--blue);
  color:white;font-weight:700;padding:0 17px;
}
.tabs{display:flex;gap:8px;overflow:auto;padding:13px 0}
.tab{
  background:#101e30;color:#b8c6d6;padding:8px 12px;
  border-radius:18px;white-space:nowrap;font-size:13px;
}
.tab.active{background:#123f66;color:#58b9ff}
#status{color:var(--muted);font-size:13px;margin:5px 2px 13px}
.item{
  display:block;color:inherit;text-decoration:none;
  background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:14px;margin:9px 0;
}
.meta{
  display:flex;justify-content:space-between;gap:10px;
  color:#58b9ff;font-size:11px;font-weight:700;
}
.title{font-size:16px;font-weight:700;line-height:1.35;margin:7px 0}
.desc{color:#bdc9d7;font-size:13px;line-height:1.4}
.empty{text-align:center;color:var(--muted);padding:35px}
footer{
  position:fixed;bottom:0;left:0;right:0;
  background:#091525ee;border-top:1px solid var(--line);
  padding:12px;text-align:center;color:#8ea0b5;font-size:12px;
}
</style>
</head>

<body>
<main>
<h1>◉ <span class="logo">AESF</span> RADAR</h1>

<form id="search" class="search">
<input id="q" placeholder="Buscar cualquier palabra o frase…" autocomplete="off">
<button>BUSCAR</button>
</form>

<div class="tabs">
<span class="tab active">TODO</span>
<span class="tab">NOTICIAS</span>
<span class="tab">REDES</span>
<span class="tab">OFICIAL</span>
<span class="tab">WEB</span>
</div>

<div id="status">
Busca, por ejemplo: Ferrol, Navantia, Racing de Ferrol, F-110…
</div>

<div id="results"></div>
</main>

<footer>AESF RADAR · búsqueda pública federada</footer>

<script>
const q = document.getElementById("q");
const status = document.getElementById("status");
const results = document.getElementById("results");
let data=[];

function safe(s){
 return (s||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function render(){
 data.sort((a,b)=>(b.time||0)-(a.time||0));

 if(!data.length){
   results.innerHTML='<div class="empty">Sin resultados.</div>';
   return;
 }

 results.innerHTML=data.slice(0,100).map(x=>`
 <a class="item" href="${safe(x.url)}" target="_blank" rel="noopener">
   <div class="meta">
     <span>${safe(x.source)}</span>
     <span>${x.time ? new Date(x.time).toLocaleString("es-ES") : ""}</span>
   </div>
   <div class="title">${safe(x.title)}</div>
   ${x.desc ? `<div class="desc">${safe(x.desc).slice(0,300)}</div>` : ""}
 </a>`).join("");
}

async function bluesky(term){
 try{
   const url=
   "https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q="+
   encodeURIComponent(term)+"&limit=50&sort=latest";

   const j=await fetch(url).then(r=>r.json());

   return (j.posts||[]).map(p=>({
     source:"BLUESKY",
     title:p.record?.text||"Publicación",
     desc:"@"+(p.author?.handle||""),
     url:"https://bsky.app/profile/"+p.author.did+
         "/post/"+p.uri.split("/").pop(),
     time:Date.parse(p.indexedAt)
   }));
 }catch(e){return []}
}

async function diario(term){
 try{
   const xml=await fetch("diario_ferrol.xml?t="+Date.now())
                  .then(r=>r.text());

   const doc=new DOMParser().parseFromString(xml,"text/xml");

   return [...doc.querySelectorAll("item")]
   .map(i=>({
      source:"DIARIO DE FERROL",
      title:i.querySelector("title")?.textContent||"",
      desc:(i.querySelector("description")?.textContent||"")
            .replace(/<[^>]*>/g," "),
      url:i.querySelector("link")?.textContent||"#",
      time:Date.parse(i.querySelector("pubDate")?.textContent||"")
   }))
   .filter(x=>
      (x.title+" "+x.desc).toLowerCase()
      .includes(term.toLowerCase())
   );

 }catch(e){return []}
}

async function gdelt(term){
 try{
   const url=
   "https://api.gdeltproject.org/api/v2/doc/doc?query="+
   encodeURIComponent(term)+
   "&mode=artlist&maxrecords=50&sort=datedesc&format=json";

   const j=await fetch(url).then(r=>r.json());

   return (j.articles||[]).map(a=>({
     source:"NOTICIAS · "+(a.domain||"GDELT"),
     title:a.title||a.url,
     desc:a.language||"",
     url:a.url,
     time:0
   }));
 }catch(e){return []}
}

document.getElementById("search").addEventListener("submit",async e=>{
 e.preventDefault();

 const term=q.value.trim();
 if(!term)return;

 data=[];
 render();

 status.textContent='Buscando "'+term+'"…';

 const searches=[
   bluesky(term),
   gdelt(term),
   diario(term)
 ];

 searches.forEach(p=>{
   p.then(items=>{
     data.push(...items);
     render();
     status.textContent=
       data.length+" resultados encontrados · más recientes primero";
   });
 });

 await Promise.allSettled(searches);

 status.textContent=
   data.length+
   " resultados · Bluesky + noticias globales + Diario de Ferrol";
});
</script>
</body>
</html>
