name: AESF Radar Collector

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Texto a buscar en AESF RADAR"
        required: false
        default: "Ferrol"
        type: string

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: aesf-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar recolector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RADAR_QUERY: ${{ github.event.inputs.query || 'Ferrol' }}
          RUN_YOUTUBE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          echo "Consulta AESF RADAR: $RADAR_QUERY"
          echo "YouTube activo: $RUN_YOUTUBE"
          python scripts/collect.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "AESF Radar Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "AESF Radar: actualización automática"
          git push
